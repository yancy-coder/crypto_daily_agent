[project]
name = "crypto_daily_agent"
version = "2.0.0"
description = "每日加密资讯图片推送 Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.0",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.3",
    "jinja2>=3.1.4",
    "playwright>=1.53.0",
    "python-dotenv>=1.1.0",
    "apscheduler>=3.10.4",
    "Pillow>=11.2.1",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "aiosqlite>=0.20.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "aioresponses>=0.7.0",
    "ruff>=0.3.0",
    "pyright>=1.1.350",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "D", "UP", "B", "C4", "SIM"]

[tool.pyright]
pythonVersion = "3.11"
strict = ["src"]
